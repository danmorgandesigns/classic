<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dan Morgan Designs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="css/classic.css" rel="stylesheet">
</head>

<body class="bg-mac-os min-h-screen flex items-center justify-center p-4">

    <div id="desktop-container"></div>

    <!-- Window container -->
    <div class="hypercard-window">

        <div class="modal-titlebar  modal-titlebar--static relative flex items-center">

            <div class="absolute inset-0 flex justify-center items-center pointer-events-none">
                <span class="bg-white px-2 py-[1px] leading-none z-10 modal-title">Portfolio</span>
            </div>
        </div>

        <!-- Inner Layout -->
        <div class="flex flex-col flex-1 overflow-hidden min-h-0">

            <!-- Top Row (Fixed 32px) -->
            <div class="h-8 px-4 pt-5 flex items-center justify-between">
                <button id="home-button" class="icon-button w-8 h-8">
                    <img src="images/home.svg" alt="Home" />
                </button>
                <button id="mail-button" class="icon-button w-8 h-8">
                    <img src="images/mail.svg" alt="Contact" />
                </button>
            </div>

            <!-- Scrollable Content -->
            <span class="classic-serif-heading pt-6 pb-2 pl-4">Portfolio</span>

            <div class="flex-1 overflow-y-auto space-y-4"> <!--begin middle container-->
                <div class="flex flex-col pl-8 pr-6 space-y-1 w-full"> <!--begin inner grid-->

                    <!-- Portfolio Grid -->
                    <div class="flex flex-wrap gap-2 mb-2">

                        <img src="portfolio/corporate-portfolio-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/corporate-portfolio.pdf"
                            data-aspect="1.294" alt="Corporate Portfolio" />

                        <img src="portfolio/brand-guidelines-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/brand-guidelines.pdf"
                            data-aspect="1.78" alt="ServiTech Brand Guidelines" />

                        <img src="portfolio/software-design-system-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/software-design-system-portrait.pdf"
                            alt="ServiTech Software Design System" />

                        <img src="portfolio/sale-catalog-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/sale-catalog.pdf"
                            data-aspect="1.78" alt="Angus Sale Catalog" />

                        <img src="portfolio/the-crop-file-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/the-crop-file.pdf"
                            data-aspect="1.78" alt="The Crop File Knowledge Base" />

                        <img src="portfolio/marketing-examples-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/marketing-examples.pdf"
                            data-aspect="1.78" alt="ServiTech Marketing Examples" />

                        <img src="portfolio/tradeshow-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/tradeshow.pdf"
                            data-aspect="1.78" alt="ServiTech Tradeshow Booth" />

                        <img src="portfolio/main-website-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/servitech-main-website.pdf"
                            data-aspect="1.78" alt="ServiTech Main Website" />

                        <img src="portfolio/intranet-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/intranet.pdf"
                            data-aspect="1.78" alt="ServiTech Company Intranet" />

                        <img src="portfolio/asm-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/asm.pdf"
                            data-aspect="1.78" alt="Agronomy Service Manager (ASM)" />

                        <img src="portfolio/asset-manager-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/asset-manager.pdf"
                            data-aspect="1.78" alt="Asset Manager" />

                        <img src="portfolio/employee-manager-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/employee-manager.pdf"
                            data-aspect="1.78" alt="Employee Manager" />

                        <img src="portfolio/catbackers-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/catbackers.pdf"
                            data-aspect="1.78" alt="Southwest Catbackers" />

                        <img src="portfolio/fota-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/fota.pdf"
                            data-aspect="1.78" alt="Friends of the Arboretum (FOTA) Membership" />

                        <img src="portfolio/merch-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/merch.pdf"
                            data-aspect="1.78" alt="Merch Store Selections" />

                        <img src="portfolio/personal-promotion-thumbnail.jpeg"
                            class="pdf-launcher h-[180px] w-[calc(50%-0.25rem)] md:w-[calc(33.333%-0.333rem)] object-contain block rounded cursor-pointer"
                            data-full="https://raw.githubusercontent.com/danmorgandesigns/classic/main/portfolio/personal-promotion.pdf"
                            data-aspect="1.78" alt="Personal Promotion" />

                    </div>





                </div> <!--end inner grid-->
            </div> <!--end middle container-->
        </div>

        <!-- Bottom Row (Fixed 32px) -->
        <div class="h-8 mt-3 px-4 pb-4 flex items-center justify-between">
            <button id="previous-button" class="icon-button w-8 h-8">
                <img src="images/hand-pointing-left.svg" alt="Previous" />
            </button>
            <button id="next-button" class="icon-button w-8 h-8">
                <img src="images/hand-pointing-right.svg" alt="Next" />
            </button>
        </div>


        <div id="invader-container"></div>

    </div>

    <!-- end hypercard-window -->
    <div id="palette-container"></div>
    <div id="viewer-container"></div>
    <div id="aboutmac-container"></div>





    <script>
        document.getElementById('mail-button')?.addEventListener('click', () => {
            window.location.href = 'contact-me.html';
        });

        document.getElementById('home-button')?.addEventListener('click', () => {
            window.location.href = '/index.html';
        });

        document.getElementById('previous-button')?.addEventListener('click', () => {
            window.location.href = 'apps.html';
        });

        document.getElementById('next-button')?.addEventListener('click', () => {
            window.location.href = 'blog.html';
        });

        document.addEventListener("touchstart", function () { }, true);


    </script>

    <script src="js/invaders.js"></script>
    <script src="js/desktop-ui.js"></script>
    <script src="js/palette.js"></script>
    <script src="js/viewer.js"></script>
    <script src="js/aboutmac.js"></script>
</body>

</html>
